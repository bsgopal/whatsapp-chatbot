version: '3.8'

services:
  # ── MongoDB ────────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: wa_appt_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: wa_appt_os
    networks:
      - wa_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend ────────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wa_appt_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/wa_appt_os
      JWT_SECRET: ${JWT_SECRET:-super_secret_change_in_production_minimum_32_chars}
      JWT_EXPIRE: 7d
      CLIENT_URL: http://localhost:3000
      WA_VERIFY_TOKEN: ${WA_VERIFY_TOKEN:-wa_appt_os_secure}
      CHATBOT_ENGINE: ${CHATBOT_ENGINE:-python}
      PYTHON_CHATBOT_URL: http://python-bot:8001
    depends_on:
      mongo:
        condition: service_healthy
      python-bot:
        condition: service_started
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    networks:
      - wa_net

  # ── Frontend ───────────────────────────────────────────────────────────────────
  python-bot:
    build:
      context: ./python-chatbot
      dockerfile: Dockerfile
    container_name: wa_appt_python_bot
    restart: unless-stopped
    ports:
      - "8001:8001"
    networks:
      - wa_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000
    container_name: wa_appt_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - wa_net

volumes:
  mongo_data:
  backend_uploads:
  backend_logs:

networks:
  wa_net:
    driver: bridge
